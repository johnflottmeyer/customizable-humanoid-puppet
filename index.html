<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Humanoid Avatar</title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >
</head>

<body>

    <div id="avatarEditor">

        <!-- ==========================
             CHARACTER PREVIEW
        =========================== -->

        <div id="character">

            <svg
                id="face"
                viewBox="0 0 500 600"
                xmlns="http://www.w3.org/2000/svg"
            >
<defs>
<radialGradient id="skinGradient"
                cx="40%"
                cy="30%"
                r="75%">

    <stop offset="0%" style="stop-color:var(--skin-light);" />
    <stop offset="55%" style="stop-color:var(--skin-mid);" />
    <stop offset="100%" style="stop-color:var(--skin-dark);" />
	</radialGradient>

	<radialGradient
    id="eyeGradient"
    cx="38%"
    cy="30%"
    r="80%">

    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="55%" stop-color="#F4F4F4"/>
    <stop offset="100%" stop-color="#C2C2C2"/>
    <!--
        <stop offset="100%" stop-color="#C8C8C8"/>
        <stop offset="55%" stop-color="#F7F7F7"/>
    -->

</radialGradient>

<radialGradient
    id="irisGradient"
    cx="35%"
    cy="30%"
    r="70%">

   
<stop offset="100%" stop-color="#123F73"/>
    <stop offset="65%" stop-color="#2F8DD8"/>
     <stop offset="0%" stop-color="#74C8FF"/>

</radialGradient>

<radialGradient
    id="pupilGradient"
    cx="35%"
    cy="30%"
    r="70%">

    <stop offset="0%" stop-color="#2E2E2E"/>
    <stop offset="100%" stop-color="#000000"/>

</radialGradient>

<radialGradient
    id="leftEyeSocketGradient"
    gradientUnits="userSpaceOnUse"
    cx="183"
    cy="225"
    r="68"
    gradientTransform="translate(0 85) scale(1 0.62)"
>
    <stop offset="0%" stop-color="#744429" stop-opacity="0.60" />
    <stop offset="42%" stop-color="#9c6440" stop-opacity="0.45" />
    <stop offset="75%" stop-color="#c98d61" stop-opacity="0.15" />
    <stop offset="100%" stop-color="#e6ad7d" stop-opacity="0" />
</radialGradient>

<radialGradient
    id="rightEyeSocketGradient"
    gradientUnits="userSpaceOnUse"
    cx="317"
    cy="225"
    r="68"
    gradientTransform="translate(0 85) scale(1 0.62)"
>
    <stop offset="0%" stop-color="#744429" stop-opacity="0.60" />
    <stop offset="42%" stop-color="#9c6440" stop-opacity="0.45" />
    <stop offset="75%" stop-color="#c98d61" stop-opacity="0.15" />
    <stop offset="100%" stop-color="#e6ad7d" stop-opacity="0" />
</radialGradient>

<!-- ==========================
     BROW RIDGE GRADIENTS
========================== -->

<radialGradient
    id="leftBrowRidgeGradient"
    gradientUnits="userSpaceOnUse"
    cx="188"
    cy="190"
    r="70"
    gradientTransform="translate(0 70) scale(1 0.64)"
>
    <stop
        offset="0%"
        stop-color="#925a3a"
        stop-opacity="0.34"
    />

    <stop
        offset="42%"
        stop-color="#b67851"
        stop-opacity="0.22"
    />

    <stop
        offset="74%"
        stop-color="#d99e74"
        stop-opacity="0.09"
    />

    <stop
        offset="100%"
        stop-color="#edbb91"
        stop-opacity="0"
    />
</radialGradient>


<radialGradient
    id="rightBrowRidgeGradient"
    gradientUnits="userSpaceOnUse"
    cx="312"
    cy="190"
    r="70"
    gradientTransform="translate(0 70) scale(1 0.64)"
>
    <stop
        offset="0%"
        stop-color="#925a3a"
        stop-opacity="0.34"
    />

    <stop
        offset="42%"
        stop-color="#b67851"
        stop-opacity="0.22"
    />

    <stop
        offset="74%"
        stop-color="#d99e74"
        stop-opacity="0.09"
    />

    <stop
        offset="100%"
        stop-color="#edbb91"
        stop-opacity="0"
    />
</radialGradient>

<radialGradient
    id="glabellaGradient"
    gradientUnits="userSpaceOnUse"
    cx="250"
    cy="196"
    r="44"
    gradientTransform="translate(0 54) scale(1 0.72)"
>
    <stop
        offset="0%"
        stop-color="#a56b49"
        stop-opacity="0.22"
    />

    <stop
        offset="52%"
        stop-color="#c78c65"
        stop-opacity="0.10"
    />

    <stop
        offset="100%"
        stop-color="#e8b185"
        stop-opacity="0"
    />
</radialGradient>

<linearGradient
    id="leftForeheadTransitionGradient"
    gradientUnits="userSpaceOnUse"
    x1="175"
    y1="115"
    x2="196"
    y2="210"
>
    <stop
        offset="0%"
        stop-color="#ffe0c2"
        stop-opacity="0"
    />

    <stop
        offset="60%"
        stop-color="#c9855c"
        stop-opacity="0.16"
    />

    <stop
        offset="100%"
        stop-color="#8c5134"
        stop-opacity="0.38"
    />
</linearGradient>


<linearGradient
    id="rightForeheadTransitionGradient"
    gradientUnits="userSpaceOnUse"
    x1="325"
    y1="115"
    x2="304"
    y2="210"
>
    <stop
        offset="0%"
        stop-color="#ffe0c2"
        stop-opacity="0"
    />

    <stop
        offset="60%"
        stop-color="#c9855c"
        stop-opacity="0.16"
    />

    <stop
        offset="100%"
        stop-color="#8c5134"
        stop-opacity="0.38"
    />
</linearGradient>

<!-- ==========================
     MAIN NOSE
========================== -->

<linearGradient
    id="noseMainGradient"
    gradientUnits="userSpaceOnUse"
    x1="250"
    y1="300"
    x2="250"
    y2="420"
    gradientTransform="translate(250 0) scale(0.88 1) translate(-250 0)"
>

    <!-- Invisible bridge -->

    <stop
        offset="0%"
        stop-color="#efbd91"
        stop-opacity="0"
    />

    <stop
        offset="32%"
        stop-color="#efbd91"
        stop-opacity="0"
    />

    <!-- Nasal bone -->

    <stop
        offset="56%"
        stop-color="#dc9a72"
        stop-opacity=".12"
    />

    <!-- Upper cartilage -->

    <stop
        offset="78%"
        stop-color="#c77c5b"
        stop-opacity=".32"
    />

    <!-- Lower bridge -->

    <stop
        offset="100%"
        stop-color="#b7674d"
        stop-opacity=".46"
    />

</linearGradient>
<!-- ==========================
     LEFT NOSTRIL WING
========================== -->

<linearGradient
    id="leftNostrilGradient"
    x1="0%"
    y1="0%"
    x2="0%"
    y2="100%"
>
    <!-- Top is face color and invisible -->

    <stop
        offset="0%"
        stop-color="#efbd91"
        stop-opacity="0"
    />

    <stop
        offset="38%"
        stop-color="#efbd91"
        stop-opacity="0"
    />

    <stop
        offset="70%"
        stop-color="#d68d68"
        stop-opacity=".35"
    />

    <stop
        offset="100%"
        stop-color="#bb6c51"
        stop-opacity=".68"
    />
</linearGradient>


<!-- ==========================
     RIGHT NOSTRIL WING
========================== -->

<linearGradient
    id="rightNostrilGradient"
    x1="0%"
    y1="0%"
    x2="0%"
    y2="100%"
>
    <stop
        offset="0%"
        stop-color="#efbd91"
        stop-opacity="0"
    />

    <stop
        offset="38%"
        stop-color="#efbd91"
        stop-opacity="0"
    />

    <stop
        offset="70%"
        stop-color="#d68d68"
        stop-opacity=".35"
    />

    <stop
        offset="100%"
        stop-color="#bb6c51"
        stop-opacity=".68"
    />
</linearGradient>


<!-- ==========================
     NOSTRIL HOLES
========================== -->

<radialGradient
    id="leftNostrilHoleGradient"
    cx="55%"
    cy="55%"
    r="70%"
>
    <stop
        offset="0%"
        stop-color="#351713"
    />

    <stop
        offset="45%"
        stop-color="#52251d"
    />

    <stop
        offset="78%"
        stop-color="#874735"
        stop-opacity=".75"
    />

    <stop
        offset="100%"
        stop-color="#bb6c51"
        stop-opacity="0"
    />
</radialGradient>


<radialGradient
    id="rightNostrilHoleGradient"
    cx="45%"
    cy="55%"
    r="70%"
>
    <stop
        offset="0%"
        stop-color="#351713"
    />

    <stop
        offset="45%"
        stop-color="#52251d"
    />

    <stop
        offset="78%"
        stop-color="#874735"
        stop-opacity=".75"
    />

    <stop
        offset="100%"
        stop-color="#bb6c51"
        stop-opacity="0"
    />
</radialGradient>
<radialGradient
    id="noseFrontGradient"
    gradientUnits="userSpaceOnUse"
    cx="250"
    cy="386"
    r="24">

    <stop offset="0%" stop-color="var(--skin-light)" stop-opacity="0.85"/>

    <stop offset="35%" stop-color="var(--skin-mid)" stop-opacity="0.78"/>

    <stop offset="72%" stop-color="#d29a72" stop-opacity="0.65"/>

    <stop offset="100%" stop-color="#bd795d" stop-opacity="0.18"/>

</radialGradient>
<radialGradient
    id="noseBottomShadowGradient"
    cx="50%"
    cy="50%"
    r="50%"
>
    <stop
        offset="0%"
        stop-color="#6b362a"
        stop-opacity="0.34"
    />

    <stop
        offset="52%"
        stop-color="#8c4c39"
        stop-opacity="0.20"
    />

    <stop
        offset="100%"
        stop-color="#a9634b"
        stop-opacity="0"
    />
</radialGradient>
<!-- ==========================
     UPPER LIP
========================== -->

<linearGradient
    id="upperLipGradient"
    gradientUnits="userSpaceOnUse"
    x1="250"
    y1="365"
    x2="250"
    y2="390"
>
    <stop
        offset="0%"
        stop-color="#a76568"
    />

    <stop
        offset="55%"
        stop-color="#b97373"
    />

    <stop
        offset="100%"
        stop-color="#945558"
    />
</linearGradient>


<!-- ==========================
     LOWER LIP
========================== -->

<linearGradient
    id="lowerLipGradient"
    gradientUnits="userSpaceOnUse"
    x1="250"
    y1="380"
    x2="250"
    y2="405"
>
    <stop
        offset="0%"
        stop-color="#a96568"
    />

    <stop
        offset="48%"
        stop-color="#c27e7b"
    />

    <stop
        offset="100%"
        stop-color="#ad6868"
    />
</linearGradient>


<!-- ==========================
     MOUTH OPENING
========================== -->

<radialGradient
    id="mouthOpeningGradient"
    cx="50%"
    cy="50%"
    r="70%"
>
    <stop
        offset="0%"
        stop-color="#5a3135"
        stop-opacity="0.72"
    />

    <stop
        offset="65%"
        stop-color="#744348"
        stop-opacity="0.48"
    />

    <stop
        offset="100%"
        stop-color="#8b5558"
        stop-opacity="0"
    />
</radialGradient>

<!-- ==========================
     LOWER LIP HIGHLIGHT
========================== -->

<radialGradient
    id="lowerLipHighlightGradient"
    cx="50%"
    cy="50%"
    r="50%"
>
    <stop
        offset="0%"
        stop-color="#efb2a7"
        stop-opacity="0.42"
    />

    <stop
        offset="55%"
        stop-color="#e6a096"
        stop-opacity="0.18"
    />

    <stop
        offset="100%"
        stop-color="#e6a096"
        stop-opacity="0"
    />
</radialGradient>


<!-- ==========================
     UNDER-LIP SHADOW
========================== -->

<radialGradient
    id="underLipShadowGradient"
    cx="50%"
    cy="50%"
    r="50%"
>
    <stop
        offset="0%"
        stop-color="#7e493b"
        stop-opacity="0.20"
    />

    <stop
        offset="55%"
        stop-color="#965a47"
        stop-opacity="0.10"
    />

    <stop
        offset="100%"
        stop-color="#aa7059"
        stop-opacity="0"
    />
</radialGradient>
</defs>
                <path
    id="head"
    fill="url(#skinGradient)"
    stroke="#2b211d"
    stroke-width="4"/></path>

<!-- ==========================
     BROW RIDGE ANATOMY
========================== -->

<g
    id="browAnatomy"
    pointer-events="none"
>

    <!-- Soft forehead planes -->

    <path
        id="leftForeheadTransition"
        fill="url(#leftForeheadTransitionGradient)"
    ></path>

    <path
        id="rightForeheadTransition"
        fill="url(#rightForeheadTransitionGradient)"
    ></path>


    <!-- Central glabella -->

    <path
        id="glabella"
        fill="url(#glabellaGradient)"
    ></path>


    <!-- Main brow shelves -->

    <path
        id="leftBrowRidge"
        fill="url(#leftBrowRidgeGradient)"
    ></path>

    <path
        id="rightBrowRidge"
        fill="url(#rightBrowRidgeGradient)"
    ></path>

</g>
<!-- ==========================
     EYE ANATOMY ENGINE V2
========================== -->

<defs>

    <!-- LEFT EYE OPENING CLIP -->

    <clipPath id="leftEyeClip">
        <path id="leftEyeClipPath"></path>
    </clipPath>


    <!-- RIGHT EYE OPENING CLIP -->

    <clipPath id="rightEyeClip">
        <path id="rightEyeClipPath"></path>
    </clipPath>

</defs>


<g id="eyes">


    <!-- ==========================
         LEFT EYE
    =========================== -->

    <g id="leftEyeGroup">


        <!-- ORBITAL SOCKET -->

        <path
            id="leftEyeSocket"
            fill="url(#leftEyeSocketGradient)"
            opacity="0.8"
        ></path>


        <!-- UPPER SOCKET / BROW-SHELF SHADOW -->

        <path
            id="leftUpperSocketShadow"
            fill="none"
            stroke="var(--skin-dark)"
            stroke-width="7"
            stroke-linecap="round"
            opacity="0.12"
        ></path>


        <!-- EYE WHITE -->

        <path
            id="leftEyeWhite"
            fill="url(#eyeGradient)"
            stroke="#8b817b"
            stroke-width="0.8"
            stroke-linejoin="round"
        ></path>


        <!-- IRIS CONTENT CLIPPED TO EYE OPENING -->

        <g clip-path="url(#leftEyeClip)">

            <circle
                id="leftIris"
                fill="url(#irisGradient)"
                stroke="#354638"
                stroke-width="1"
            ></circle>

            <circle
                id="leftIrisInner"
                fill="none"
                stroke="#a7b79f"
                stroke-width="1"
                opacity="0.65"
            ></circle>

            <circle
                id="leftPupil"
                fill="url(#pupilGradient)"
            ></circle>

            <circle
                id="leftEyeHighlight"
                fill="#ffffff"
                opacity="0.9"
            ></circle>

        </g>


        <!-- TEAR DUCT -->

        <path
            id="leftTearDuct"
            fill="#d99a91"
            stroke="#8f655f"
            stroke-width="0.55"
            stroke-linejoin="round"
            opacity="0.72"
        ></path>


        <!-- UPPER LID EDGE -->

        <path
            id="leftUpperLid"
            fill="none"
            stroke="#3a2b26"
            stroke-width="2.4"
            stroke-linecap="round"
        ></path>


        <!-- LOWER LID EDGE -->

        <path
            id="leftLowerLid"
            fill="none"
            stroke="#5b4740"
            stroke-width="1.25"
            stroke-linecap="round"
            opacity="0.72"
        ></path>


        <!-- UPPER LID CREASE -->

        <path
            id="leftUpperLidCrease"
            fill="none"
            stroke="#6f5146"
            stroke-width="1.4"
            stroke-linecap="round"
            opacity="0.38"
        ></path>


        <!-- LOWER LID CREASE / UNDER-EYE LINE -->

        <path
            id="leftLowerLidCrease"
            fill="none"
            stroke="#8a6658"
            stroke-width="1"
            stroke-linecap="round"
            opacity="0.18"
        ></path>

    </g>


    <!-- ==========================
         RIGHT EYE
    =========================== -->

    <g id="rightEyeGroup">


        <!-- ORBITAL SOCKET -->

        <path
            id="rightEyeSocket"
            fill="url(#rightEyeSocketGradient)"
            opacity="0.8"
        ></path>


        <!-- UPPER SOCKET / BROW-SHELF SHADOW -->

        <path
            id="rightUpperSocketShadow"
            fill="none"
            stroke="var(--skin-dark)"
            stroke-width="7"
            stroke-linecap="round"
            opacity="0.12"
        ></path>


        <!-- EYE WHITE -->

        <path
            id="rightEyeWhite"
            fill="url(#eyeGradient)"
            stroke="#8b817b"
            stroke-width="0.8"
            stroke-linejoin="round"
        ></path>


        <!-- IRIS CONTENT CLIPPED TO EYE OPENING -->

        <g clip-path="url(#rightEyeClip)">

            <circle
                id="rightIris"
                fill="url(#irisGradient)"
                stroke="#354638"
                stroke-width="1"
            ></circle>

            <circle
                id="rightIrisInner"
                fill="none"
                stroke="#a7b79f"
                stroke-width="1"
                opacity="0.65"
            ></circle>

            <circle
                id="rightPupil"
                fill="url(#pupilGradient)"
            ></circle>

            <circle
                id="rightEyeHighlight"
                fill="#ffffff"
                opacity="0.9"
            ></circle>

        </g>


        <!-- TEAR DUCT -->

        <path
            id="rightTearDuct"
            fill="#d99a91"
            stroke="#8f655f"
            stroke-width="0.55"
            stroke-linejoin="round"
            opacity="0.72"
        ></path>


        <!-- UPPER LID EDGE -->

        <path
            id="rightUpperLid"
            fill="none"
            stroke="#3a2b26"
            stroke-width="2.4"
            stroke-linecap="round"
        ></path>


        <!-- LOWER LID EDGE -->

        <path
            id="rightLowerLid"
            fill="none"
            stroke="#5b4740"
            stroke-width="1.25"
            stroke-linecap="round"
            opacity="0.72"
        ></path>


        <!-- UPPER LID CREASE -->

        <path
            id="rightUpperLidCrease"
            fill="none"
            stroke="#6f5146"
            stroke-width="1.4"
            stroke-linecap="round"
            opacity="0.38"
        ></path>


        <!-- LOWER LID CREASE / UNDER-EYE LINE -->

        <path
            id="rightLowerLidCrease"
            fill="none"
            stroke="#8a6658"
            stroke-width="1"
            stroke-linecap="round"
            opacity="0.18"
        ></path>

    </g>

</g>

<!-- ==========================
     NOSE
========================== -->

<g id="nose">

    <path id="leftNostril"></path>

    <path id="rightNostril"></path>

    <ellipse
        id="noseShadow"
        cx="250"
        cy="374"
        rx="22"
        ry="33"
    />

    <ellipse
        id="noseBottomShadow"
        cx="250"
        cy="399"
        rx="22"
        ry="5"
    />

    <ellipse
        id="leftNostrilHole"
        cx="231"
        cy="399"
        rx="11"
        ry="4"
    />

    <ellipse
        id="rightNostrilHole"
        cx="269"
        cy="399"
        rx="11"
        ry="4"
    />

    <path
        id="noseFront"
        d=""
    />

</g> 
<!-- ==========================
     MOUTH
========================== -->

<!-- ==========================
     MOUTH
========================== -->
<g id="mouthGroup">

    <ellipse id="underLipShadow"></ellipse>

    <path id="upperLip"></path>

    <path id="lowerLip"></path>

    <path id="mouthOpening"></path>

    <ellipse id="lowerLipHighlight"></ellipse>

</g>
 </svg>

        </div>


        <!-- ==========================
             CUSTOMIZE BUTTON
        =========================== -->

        <button
            type="button"
            id="customizeButton"
            aria-controls="customizeDrawer"
            aria-expanded="false"
        >
            Customize
        </button>


        <!-- ==========================
             DRAWER OVERLAY
        =========================== -->

        <div
            id="drawerOverlay"
            aria-hidden="true"
        ></div>


        <!-- ==========================
             CUSTOMIZE DRAWER
        =========================== -->

        <aside
            id="customizeDrawer"
            aria-hidden="true"
        >

            <div class="drawer-header">

                <h2>Customize</h2>

                <button
                    type="button"
                    id="closeDrawerButton"
                    aria-label="Close customize drawer"
                >
                    &times;
                </button>

            </div>


            <!-- ==========================
                 CUSTOMIZE PANELS
            =========================== -->

            <div id="customizePanels">


                <!-- ==========================
                     HEAD CONTROLS
                =========================== -->

                <details open>

                    <summary>Head</summary>

                    <div
                        id="headControls"
                        class="panelBody"
                    >

                        <label>
                            Head height

                            <span id="headHeightValue"></span>

                            <input
                                type="range"
                                id="headHeight"
                                min="400"
                                max="560"
                                value="475"
                            >
                        </label>


                        <label>
                            Forehead width

                            <span id="foreheadWidthValue"></span>

                            <input
                                type="range"
                                id="foreheadWidth"
                                min="70"
                                max="140"
                                value="105"
                            >
                        </label>


                        <label>
                            Temple width

                            <span id="templeWidthValue"></span>

                            <input
                                type="range"
                                id="templeWidth"
                                min="90"
                                max="170"
                                value="138"
                            >
                        </label>


                        <label>
                            Cheek width

                            <span id="cheekWidthValue"></span>

                            <input
                                type="range"
                                id="cheekWidth"
                                min="90"
                                max="175"
                                value="142"
                            >
                        </label>


                        <label>
                            Jaw width

                            <span id="jawWidthValue"></span>

                            <input
                                type="range"
                                id="jawWidth"
                                min="60"
                                max="150"
                                value="108"
                            >
                        </label>


                        <label>
                            Chin width

                            <span id="chinWidthValue"></span>

                            <input
                                type="range"
                                id="chinWidth"
                                min="35"
                                max="110"
                                value="82"
                            >
                        </label>


                        <label>
                            Chin bottom width

                            <span id="chinBottomWidthValue"></span>

                            <input
                                type="range"
                                id="chinBottomWidth"
                                min="10"
                                max="80"
                                value="48"
                            >
                        </label>


                        <label>
                            Chin depth

                            <span id="chinDepthValue"></span>

                            <input
                                type="range"
                                id="chinDepth"
                                min="0"
                                max="40"
                                value="10"
                            >
                        </label>


                        <label>
                            Chin roundness

                            <span id="chinRoundnessValue"></span>

                            <input
                                type="range"
                                id="chinRoundness"
                                min="5"
                                max="60"
                                value="34"
                            >
                        </label>


                        <!-- ==========================
                             HEAD BUTTONS
                        =========================== -->

                        <div class="control-buttons">

                            <button
                                type="button"
                                id="saveHead"
                            >
                                Save head
                            </button>

                            <button
                                type="button"
                                id="loadHead"
                            >
