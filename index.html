<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Humanoid Avatar</title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >
</head>

<body>

    <div id="avatarEditor">

        <!-- ==========================
             CHARACTER PREVIEW
        =========================== -->

        <div id="character">

            <svg
                id="face"
                viewBox="0 0 500 600"
                xmlns="http://www.w3.org/2000/svg"
            >
<defs>
<radialGradient id="skinGradient"
                cx="40%"
                cy="30%"
                r="75%">

    <stop offset="0%" style="stop-color:var(--skin-light);" />
    <stop offset="55%" style="stop-color:var(--skin-mid);" />
    <stop offset="100%" style="stop-color:var(--skin-dark);" />
	</radialGradient>

	<radialGradient
    id="eyeGradient"
    cx="38%"
    cy="30%"
    r="80%">

    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="55%" stop-color="#F4F4F4"/>
    <stop offset="100%" stop-color="#C2C2C2"/>
    <!--
        <stop offset="100%" stop-color="#C8C8C8"/>
        <stop offset="55%" stop-color="#F7F7F7"/>
    -->

</radialGradient>

<radialGradient
    id="irisGradient"
    cx="35%"
    cy="30%"
    r="70%">

   
<stop offset="100%" stop-color="#123F73"/>
    <stop offset="65%" stop-color="#2F8DD8"/>
     <stop offset="0%" stop-color="#74C8FF"/>

</radialGradient>

<radialGradient
    id="pupilGradient"
    cx="35%"
    cy="30%"
    r="70%">

    <stop offset="0%" stop-color="#2E2E2E"/>
    <stop offset="100%" stop-color="#000000"/>

</radialGradient>

<radialGradient
    id="leftEyeSocketGradient"
    gradientUnits="userSpaceOnUse"
    cx="183"
    cy="225"
    r="68"
    gradientTransform="translate(0 85) scale(1 0.62)"
>
    <stop offset="0%" stop-color="#744429" stop-opacity="0.60" />
    <stop offset="42%" stop-color="#9c6440" stop-opacity="0.45" />
    <stop offset="75%" stop-color="#c98d61" stop-opacity="0.15" />
    <stop offset="100%" stop-color="#e6ad7d" stop-opacity="0" />
</radialGradient>

<radialGradient
    id="rightEyeSocketGradient"
    gradientUnits="userSpaceOnUse"
    cx="317"
    cy="225"
    r="68"
    gradientTransform="translate(0 85) scale(1 0.62)"
>
    <stop offset="0%" stop-color="#744429" stop-opacity="0.60" />
    <stop offset="42%" stop-color="#9c6440" stop-opacity="0.45" />
    <stop offset="75%" stop-color="#c98d61" stop-opacity="0.15" />
    <stop offset="100%" stop-color="#e6ad7d" stop-opacity="0" />
</radialGradient>

<!-- ==========================
     MAIN NOSE
========================== -->

<linearGradient
    id="noseMainGradient"
    x1="0%"
    y1="0%"
    x2="0%"
    y2="100%"
>
    <!-- Completely blends into face -->

    <stop
        offset="0%"
        stop-color="#efbd91"
        stop-opacity="0"
    />

    <stop
        offset="38%"
        stop-color="#efbd91"
        stop-opacity="0"
    />

    <!-- Subtle nose form begins lower down -->

    <stop
        offset="62%"
        stop-color="#dc9a72"
        stop-opacity=".25"
    />

    <stop
        offset="84%"
        stop-color="#c77c5b"
        stop-opacity=".55"
    />

    <stop
        offset="100%"
        stop-color="#b7674d"
        stop-opacity=".72"
    />
</linearGradient>


<!-- ==========================
     LEFT NOSTRIL WING
========================== -->

<linearGradient
    id="leftNostrilGradient"
    x1="0%"
    y1="0%"
    x2="0%"
    y2="100%"
>
    <!-- Top is face color and invisible -->

    <stop
        offset="0%"
        stop-color="#efbd91"
        stop-opacity="0"
    />

    <stop
        offset="38%"
        stop-color="#efbd91"
        stop-opacity="0"
    />

    <stop
        offset="70%"
        stop-color="#d68d68"
        stop-opacity=".35"
    />

    <stop
        offset="100%"
        stop-color="#bb6c51"
        stop-opacity=".68"
    />
</linearGradient>


<!-- ==========================
     RIGHT NOSTRIL WING
========================== -->

<linearGradient
    id="rightNostrilGradient"
    x1="0%"
    y1="0%"
    x2="0%"
    y2="100%"
>
    <stop
        offset="0%"
        stop-color="#efbd91"
        stop-opacity="0"
    />

    <stop
        offset="38%"
        stop-color="#efbd91"
        stop-opacity="0"
    />

    <stop
        offset="70%"
        stop-color="#d68d68"
        stop-opacity=".35"
    />

    <stop
        offset="100%"
        stop-color="#bb6c51"
        stop-opacity=".68"
    />
</linearGradient>


<!-- ==========================
     NOSTRIL HOLES
========================== -->

<radialGradient
    id="leftNostrilHoleGradient"
    cx="55%"
    cy="55%"
    r="70%"
>
    <stop
        offset="0%"
        stop-color="#351713"
    />

    <stop
        offset="45%"
        stop-color="#52251d"
    />

    <stop
        offset="78%"
        stop-color="#874735"
        stop-opacity=".75"
    />

    <stop
        offset="100%"
        stop-color="#bb6c51"
        stop-opacity="0"
    />
</radialGradient>


<radialGradient
    id="rightNostrilHoleGradient"
    cx="45%"
    cy="55%"
    r="70%"
>
    <stop
        offset="0%"
        stop-color="#351713"
    />

    <stop
        offset="45%"
        stop-color="#52251d"
    />

    <stop
        offset="78%"
        stop-color="#874735"
        stop-opacity=".75"
    />

    <stop
        offset="100%"
        stop-color="#bb6c51"
        stop-opacity="0"
    />
</radialGradient>
<radialGradient
    id="noseFrontGradient"
    cx="42%"
    cy="30%"
    r="78%"
>
    <stop
        offset="0%"
        stop-color="var(--skin-light)"
        stop-opacity="0.72"
    />

    <stop
        offset="55%"
        stop-color="var(--skin-mid)"
        stop-opacity="0.82"
    />

    <stop
        offset="88%"
        stop-color="#d29a72"
        stop-opacity="0.92"
    />

    <stop
        offset="100%"
        stop-color="#bd795d"
        stop-opacity="0.88"
    />
</radialGradient><radialGradient
    id="noseBottomShadowGradient"
    cx="50%"
    cy="50%"
    r="50%"
>
    <stop
        offset="0%"
        stop-color="#6b362a"
        stop-opacity="0.34"
    />

    <stop
        offset="52%"
        stop-color="#8c4c39"
        stop-opacity="0.20"
    />

    <stop
        offset="100%"
        stop-color="#a9634b"
        stop-opacity="0"
    />
</radialGradient></defs>
                <path
    id="head"
    fill="url(#skinGradient)"
    stroke="#2b211d"
    stroke-width="4"/></path>

                <!-- Eyes, nose, mouth, and other elements go here -->
		<!-- ==========================
     EYES
========================== -->

<!-- ==========================
     EYES
========================== -->

<defs>

    <clipPath id="leftEyeClip">
        <path id="leftEyeClipPath"></path>
    </clipPath>

    <clipPath id="rightEyeClip">
        <path id="rightEyeClipPath"></path>
    </clipPath>

</defs>


<g id="eyes">

    <!-- ==========================
         LEFT EYE
    =========================== -->

    <g id="leftEyeGroup">

	<path
    id="leftEyeSocket"
    fill="url(#leftEyeSocketGradient)"
    opacity="0.8"
    rx="18"
    ry="18">
</path>

        <path
            id="leftEyeWhite"
             fill="url(#eyeGradient)"
    stroke="#888"
    stroke-width="1"
            stroke-linejoin="round"
        ></path>


        <g clip-path="url(#leftEyeClip)">

            <circle
                id="leftIris"
                fill="url(#irisGradient)"
                stroke="#354638"
                stroke-width="1"
            ></circle>

            <circle
                id="leftIrisInner"
                fill="none"
                stroke="#a7b79f"
                stroke-width="1"
                opacity="0.65"
            ></circle>

            <circle
                id="leftPupil"
                fill="url(#pupilGradient)"
            ></circle>

            <circle
                id="leftEyeHighlight"
                fill="#ffffff"
                opacity="0.9"
            ></circle>

        </g>


        <path
            id="leftUpperLid"
            fill="none"
            stroke="#2b211d"
            stroke-width="3"
            stroke-linecap="round"
        ></path>


    </g>


    <!-- ==========================
         RIGHT EYE
    =========================== -->

    <g id="rightEyeGroup">

	<path
        id="rightEyeSocket"
        fill="url(#rightEyeSocketGradient)"
    opacity="0.8"
    rx="18"
    ry="18">
</path>

        <path
            id="rightEyeWhite"
             fill="url(#eyeGradient)"
    stroke="#888"
    stroke-width="1"
            stroke-linejoin="round"
        ></path>


        <g clip-path="url(#rightEyeClip)">

            <circle
                id="rightIris"
                fill="url(#irisGradient)"
                stroke="#354638"
                stroke-width="1"
            ></circle>

            <circle
                id="rightIrisInner"
                fill="none"
                stroke="#a7b79f"
                stroke-width="1"
                opacity="0.65"
            ></circle>

            <circle
                id="rightPupil"
                fill="url(#pupilGradient)"
            ></circle>

            <circle
                id="rightEyeHighlight"
                fill="#ffffff"
                opacity="0.9"
            ></circle>

        </g>


        <path
            id="rightUpperLid"
            fill="none"
            stroke="#2b211d"
            stroke-width="3"
            stroke-linecap="round"
        ></path>


    </g>

</g>
<!-- ==========================
     NOSE
========================== -->

<!-- ==========================
     NOSE
========================== -->

<g id="nose">

    <path id="leftNostril"></path>

    <path id="rightNostril"></path>

    <ellipse
        id="noseShadow"
        cx="250"
        cy="374"
        rx="22"
        ry="33"
    />
	<!-- Soft underside shadow -->

<ellipse
    id="noseBottomShadow"
    cx="250"
    cy="399"
    rx="22"
    ry="5"
/>
    <ellipse
        id="leftNostrilHole"
        cx="231"
        cy="399"
        rx="11"
        ry="4"
    />

    <ellipse
        id="rightNostrilHole"
        cx="269"
        cy="399"
        rx="11"
        ry="4"
    />

    <path
        id="noseFront"
        d=""
    />

</g>      </svg>

        </div>


        <!-- ==========================
             CUSTOMIZE BUTTON
        =========================== -->

        <button
            type="button"
            id="customizeButton"
            aria-controls="customizeDrawer"
            aria-expanded="false"
        >
            Customize
        </button>


        <!-- ==========================
             DRAWER OVERLAY
        =========================== -->

        <div
            id="drawerOverlay"
            aria-hidden="true"
        ></div>


        <!-- ==========================
             CUSTOMIZE DRAWER
        =========================== -->

        <aside
            id="customizeDrawer"
            aria-hidden="true"
        >

            <div class="drawer-header">

                <h2>Customize</h2>

                <button
                    type="button"
                    id="closeDrawerButton"
                    aria-label="Close customize drawer"
                >
                    &times;
                </button>

            </div>


            <!-- ==========================
                 CUSTOMIZE PANELS
            =========================== -->

            <div id="customizePanels">


                <!-- ==========================
                     HEAD CONTROLS
                =========================== -->

                <details open>

                    <summary>Head</summary>

                    <div
                        id="headControls"
                        class="panelBody"
                    >

                        <label>
                            Head height

                            <span id="headHeightValue"></span>

                            <input
                                type="range"
                                id="headHeight"
                                min="400"
                                max="560"
                                value="475"
                            >
                        </label>


                        <label>
                            Forehead width

                            <span id="foreheadWidthValue"></span>

                            <input
                                type="range"
                                id="foreheadWidth"
                                min="70"
                                max="140"
                                value="105"
                            >
                        </label>


                        <label>
                            Temple width

                            <span id="templeWidthValue"></span>

                            <input
                                type="range"
                                id="templeWidth"
                                min="90"
                                max="170"
                                value="138"
                            >
                        </label>


                        <label>
                            Cheek width

                            <span id="cheekWidthValue"></span>

                            <input
                                type="range"
                                id="cheekWidth"
                                min="90"
                                max="175"
                                value="142"
                            >
                        </label>


                        <label>
                            Jaw width

                            <span id="jawWidthValue"></span>

                            <input
                                type="range"
                                id="jawWidth"
                                min="60"
                                max="150"
                                value="108"
                            >
                        </label>


                        <label>
                            Chin width

                            <span id="chinWidthValue"></span>

                            <input
                                type="range"
                                id="chinWidth"
                                min="35"
                                max="110"
                                value="82"
                            >
                        </label>


                        <label>
                            Chin bottom width

                            <span id="chinBottomWidthValue"></span>

                            <input
                                type="range"
                                id="chinBottomWidth"
                                min="10"
                                max="80"
                                value="48"
                            >
                        </label>


                        <label>
                            Chin depth

                            <span id="chinDepthValue"></span>

                            <input
                                type="range"
                                id="chinDepth"
                                min="0"
                                max="40"
                                value="10"
                            >
                        </label>


                        <label>
                            Chin roundness

                            <span id="chinRoundnessValue"></span>

                            <input
                                type="range"
                                id="chinRoundness"
                                min="5"
                                max="60"
                                value="34"
                            >
                        </label>


                        <!-- ==========================
                             HEAD BUTTONS
                        =========================== -->

                        <div class="control-buttons">

                            <button
                                type="button"
                                id="saveHead"
                            >
                                Save head
                            </button>

                            <button
                                type="button"
                                id="loadHead"
                            >
                                Load saved
                            </button>

                            <button
                                type="button"
                                id="resetHead"
                            >
                                Reset head
                            </button>

                        </div>


                        <p
                            id="saveStatus"
                            aria-live="polite"
                        ></p>

                    </div>

                </details>


                <!-- ==========================
                     EYE CONTROLS
                =========================== -->

                <details>

                    <summary>Eyes</summary>

                    <div
                        id="eyeControls"
                        class="panelBody"
                    >

                        <label>
                            Vertical position

                            <span id="eyeYValue"></span>

                            <input
                                type="range"
                                id="eyeY"
                                min="160"
                                max="320"
                                value="235"
                            >
                        </label>


                        <label>
                            Eye spacing

                            <span id="eyeSpacingValue"></span>

                            <input
                                type="range"
                                id="eyeSpacing"
                                min="60"
                                max="220"
                                value="115"
                            >
                        </label>


                        <label>
                            Eye width

                            <span id="eyeWidthValue"></span>

                            <input
                                type="range"
                                id="eyeWidth"
                                min="30"
                                max="130"
                                value="76"
                            >
                        </label>


                        <label>
                            Eye height

                            <span id="eyeHeightValue"></span>

                            <input
                                type="range"
                                id="eyeHeight"
                                min="20"
                                max="100"
                                value="48"
                            >
                        </label>


                        <label>
                            Eye rotation

                            <span id="eyeRotationValue"></span>

                            <input
                                type="range"
                                id="eyeRotation"
                                min="-30"
                                max="30"
                                value="0"
                            >
                        </label>


                        <label>
                            Iris size

                            <span id="irisSizeValue"></span>

                            <input
                                type="range"
                                id="irisSize"
                                min="8"
                                max="55"
                                value="28"
                            >
                        </label>


                        <label>
                            Pupil size

                            <span id="pupilSizeValue"></span>

                            <input
                                type="range"
                                id="pupilSize"
                                min="3"
                                max="30"
                                value="13"
                            >
                        </label>


                        <label>
                            Look left and right

                            <span id="pupilXValue"></span>

                            <input
                                type="range"
                                id="pupilX"
                                min="-18"
                                max="18"
                                value="0"
                            >
                        </label>


                        <label>
                            Look up and down

                            <span id="pupilYValue"></span>

                            <input
                                type="range"
                                id="pupilY"
                                min="-12"
                                max="12"
                                value="0"
                            >
                        </label>
			<label for="eyeUpperArch">
    Upper Lid Arch
    <span id="eyeUpperArchValue"></span>
</label>

<input
    id="eyeUpperArch"
    type="range"
    min="0.5"
    max="1.8"
    step="0.05"
>


<label for="eyeLowerArch">
    Lower Lid Arch
    <span id="eyeLowerArchValue"></span>
</label>

<input
    id="eyeLowerArch"
    type="range"
    min="0.25"
    max="1.4"
    step="0.05"
>


<label for="eyeInnerCorner">
    Inner Corner
    <span id="eyeInnerCornerValue"></span>
</label>

<input
    id="eyeInnerCorner"
    type="range"
    min="-10"
    max="10"
    step="1"
>


<label for="eyeOuterCorner">
    Outer Corner
    <span id="eyeOuterCornerValue"></span>
</label>

<input
    id="eyeOuterCorner"
    type="range"
    min="-10"
    max="10"
    step="1"
>

                        <div class="control-buttons">

                            <button
                                type="button"
                                id="saveEyes"
                            >
                                Save eyes
                            </button>

                            <button
                                type="button"
                                id="loadEyes"
                            >
                                Load saved
                            </button>

                            <button
                                type="button"
                                id="resetEyes"
                            >
                                Reset eyes
                            </button>

                        </div>


                        <p
                            id="eyeSaveStatus"
                            aria-live="polite"
                        ></p>

                    </div>

                </details>


                <!-- ==========================
     NOSE CONTROLS
========================== -->

<details>

    <summary>Nose</summary>

    <div
        id="noseControls"
        class="panelBody"
    >

        <label>
            Horizontal position

            <span id="noseXValue"></span>

            <input
                type="range"
                id="noseX"
                min="-80"
                max="80"
                value="0"
            >
        </label>


        <label>
            Vertical position

            <span id="noseYValue"></span>

            <input
                type="range"
                id="noseY"
                min="-180"
                max="80"
                value="-135"
            >
        </label>


        <label>
            Nose width

            <span id="noseWidthValue"></span>

            <input
                type="range"
                id="noseWidth"
                min="10"
                max="60"
                value="25"
            >
        </label>


        <label>
            Nose height

            <span id="noseHeightValue"></span>

            <input
                type="range"
                id="noseHeight"
                min="10"
                max="80"
                value="33"
            >
        </label>


        <label>
            Nostril spacing

            <span id="nostrilSpacingValue"></span>

            <input
                type="range"
                id="nostrilSpacing"
                min="8"
                max="50"
                value="22"
            >
        </label>


        <label>
            Nostril vertical position

            <span id="nostrilYValue"></span>

            <input
                type="range"
                id="nostrilY"
                min="350"
                max="440"
                value="397"
            >
        </label>


        <label>
            Nostril width

            <span id="nostrilWidthValue"></span>

            <input
                type="range"
                id="nostrilWidth"
                min="5"
                max="40"
                value="18"
            >
        </label>


        <label>
            Nostril height

            <span id="nostrilHeightValue"></span>

            <input
                type="range"
                id="nostrilHeight"
                min="3"
                max="30"
                value="11"
            >
        </label>


        <label>
            Nostril-hole spacing

            <span id="nostrilHoleSpacingValue"></span>

            <input
                type="range"
                id="nostrilHoleSpacing"
                min="4"
                max="40"
                value="17"
            >
        </label>


        <label>
            Nostril-hole vertical position

            <span id="nostrilHoleYValue"></span>

            <input
                type="range"
                id="nostrilHoleY"
                min="360"
                max="450"
                value="404"
            >
        </label>


        <label>
            Nostril-hole width

            <span id="nostrilHoleWidthValue"></span>

            <input
                type="range"
                id="nostrilHoleWidth"
                min="2"
                max="20"
                value="7"
            >
        </label>


        <label>
            Nostril-hole height

            <span id="nostrilHoleHeightValue"></span>

            <input
                type="range"
                id="nostrilHoleHeight"
                min="1"
                max="14"
                value="4"
            >
        </label>


        <div class="control-buttons">

            <button
                type="button"
                id="saveNose"
            >
                Save nose
            </button>

            <button
                type="button"
                id="loadNose"
            >
                Load saved
            </button>

            <button
                type="button"
                id="resetNose"
            >
                Reset nose
            </button>

        </div>


        <p
            id="noseSaveStatus"
            aria-live="polite"
        ></p>

    </div>

</details>


                <!-- ==========================
                     FUTURE MOUTH CONTROLS
                =========================== -->

                <!--
                <details>

                    <summary>Mouth</summary>

                    <div
                        id="mouthControls"
                        class="panelBody"
                    >

                        Mouth sliders will go here.

                    </div>

                </details>
                -->

            </div>

        </aside>

    </div>


    <!-- ==========================
         JAVASCRIPT
    =========================== -->

    <script src="js/head.js"></script>
    <script src="js/eyes.js"></script>
<script src="js/nose.js"></script>
    <script src="js/idle.js"></script>
    <script src="js/drawer.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
